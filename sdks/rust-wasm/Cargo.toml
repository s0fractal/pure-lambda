[package]
name = "pure-lambda-sdk"
version = "1.0.0"
edition = "2021"
authors = ["Pure Lambda Foundation"]
license = "MIT OR Apache-2.0"
description = "Official Rust/WASM SDK for Pure Lambda"
repository = "https://github.com/s0fractal/pure-lambda"

[dependencies]
# Core
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_cbor = "0.11"

# Crypto
blake3 = "1.5"
ed25519-dalek = "2.0"
x25519-dalek = "2.0"

# IPLD
libipld = "0.16"
cid = "0.11"

# WASM
wasm-bindgen = { version = "0.2", optional = true }
wasm-bindgen-futures = { version = "0.4", optional = true }
web-sys = { version = "0.3", optional = true }

# Async
tokio = { version = "1", features = ["full"], optional = true }
async-trait = "0.1"

# Error handling
thiserror = "1.0"
anyhow = "1.0"

[dev-dependencies]
criterion = "0.5"
proptest = "1.0"
quickcheck = "1.0"

[features]
default = ["native"]
native = ["tokio"]
wasm = ["wasm-bindgen", "wasm-bindgen-futures", "web-sys"]

[lib]
crate-type = ["cdylib", "rlib"]

[[example]]
name = "agent"
required-features = ["native"]

[[example]]
name = "receipt_validator"
required-features = ["native"]

[[bench]]
name = "gene_optimization"
harness = false