[package]
name = "pure-lambda-sdk"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Pure Lambda Rust SDK for PL-SEED-01 format"
authors = ["Pure Lambda Authors"]

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }

[lib]
name = "pure_lambda_sdk"
crate-type = ["lib"]