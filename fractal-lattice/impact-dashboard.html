<!DOCTYPE html>
<html>
<head>
  <title>Lambda Control Impact</title>
  <style>
    body {
      font-family: monospace;
      background: #0a0a0a;
      color: #fff;
      padding: 20px;
      max-width: 800px;
      margin: 0 auto;
    }
    .header {
      text-align: center;
      color: #4CAF50;
      font-size: 24px;
      margin-bottom: 30px;
    }
    .metric-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 20px;
      margin-bottom: 30px;
    }
    .metric {
      background: #1a1a1a;
      padding: 20px;
      border-radius: 8px;
      border: 1px solid #333;
    }
    .metric-value {
      font-size: 32px;
      color: #4CAF50;
      margin: 10px 0;
    }
    .metric-label {
      font-size: 12px;
      color: #888;
    }
    .status {
      text-align: center;
      padding: 10px;
      background: #1a1a1a;
      border-radius: 4px;
      margin-top: 20px;
    }
    .badge {
      margin: 20px auto;
      display: block;
    }
  </style>
</head>
<body>
  <div class="header">🔮 LAMBDA CONTROL IMPACT</div>

  <div class="metric-grid">
    <div class="metric">
      <div class="metric-label">CPU HOURS SAVED</div>
      <div class="metric-value">0.08h</div>
      <div class="metric-label">This week</div>
    </div>

    <div class="metric">
      <div class="metric-label">CO₂ REDUCED</div>
      <div class="metric-value">0.039kg</div>
      <div class="metric-label">Carbon offset</div>
    </div>

    <div class="metric">
      <div class="metric-label">MEDIAN SPEEDUP</div>
      <div class="metric-value">1.61×</div>
      <div class="metric-label">+61% efficiency</div>
    </div>

    <div class="metric">
      <div class="metric-label">RUNS OPTIMIZED</div>
      <div class="metric-value">7842</div>
      <div class="metric-label">This week</div>
    </div>
  </div>

  <img src="impact-badge.svg" class="badge" alt="Impact Badge">

  <div class="status">
    <strong>Status:</strong> STABLE |
    <strong>Misroute:</strong> 0.00% |
    <strong>PAC Bound:</strong> ≤27.72% @95%
  </div>

  <div class="status" style="margin-top: 10px; color: #888;">
    Generated: 2025-09-15T15:44:45.497Z
  </div>
</body>
</html>
