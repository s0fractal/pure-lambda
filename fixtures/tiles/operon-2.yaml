op: SPLIT
code: |
  // Split operation with merge skeleton
  (input) => {
    const [left, right] = split(input);
    return merge(process(left), process(right));
  }
abi:
  types: "T -> (T, T) -> T"
  effects: ["split", "merge"]
  ports:
    in: "stream"
    left: "branch_a"
    right: "branch_b"
    out: "merged"
ports:
  in: "stream"
