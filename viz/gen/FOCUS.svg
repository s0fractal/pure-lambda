<svg height="768" viewBox="0 0 1024 768" width="1024" xmlns="http://www.w3.org/2000/svg">
  <g>
    <!-- Background -->
    <rect fill="#ffffff" height="768.000" width="1024.000" x="0.000" y="0.000"/>

    <!-- Title -->
    <text font-family="monospace" font-size="16.000" x="412.000" y="50.000">FOCUS Gene</text>
    <text font-family="monospace" font-size="12.000" x="380.000" y="70.000">λ-3f5c7b2a9</text>

    <!-- Input Node -->
    <rect fill="#000000" height="60.000" stroke="#000000" stroke-width="2.000" width="120.000" x="100.000" y="200.000"/>
    <text fill="#ffffff" font-family="monospace" font-size="12.000" x="130.000" y="235.000">Input</text>
    <text fill="#ffffff" font-family="monospace" font-size="10.000" x="125.000" y="250.000">[T]</text>

    <!-- Predicate Node -->
    <rect fill="#000000" height="60.000" stroke="#000000" stroke-width="2.000" width="120.000" x="300.000" y="150.000"/>
    <text fill="#ffffff" font-family="monospace" font-size="12.000" x="325.000" y="185.000">Predicate</text>
    <text fill="#ffffff" font-family="monospace" font-size="10.000" x="320.000" y="200.000">T → Bool</text>

    <!-- Transform Node -->
    <rect fill="#000000" height="60.000" stroke="#000000" stroke-width="2.000" width="120.000" x="300.000" y="250.000"/>
    <text fill="#ffffff" font-family="monospace" font-size="12.000" x="325.000" y="285.000">Transform</text>
    <text fill="#ffffff" font-family="monospace" font-size="10.000" x="325.000" y="300.000">T → U</text>

    <!-- FOCUS Core -->
    <rect fill="#0066cc" height="80.000" stroke="#0066cc" stroke-width="3.000" width="140.000" x="500.000" y="190.000"/>
    <text fill="#ffffff" font-family="monospace" font-size="14.000" x="540.000" y="225.000">FOCUS</text>
    <text fill="#ffffff" font-family="monospace" font-size="10.000" x="520.000" y="245.000">Single Pass</text>
    <text fill="#ffffff" font-family="monospace" font-size="10.000" x="515.000" y="260.000">Zero Alloc</text>

    <!-- Output Keep -->
    <rect fill="#00cc00" height="60.000" stroke="#00cc00" stroke-width="2.000" width="120.000" x="720.000" y="150.000"/>
    <text fill="#ffffff" font-family="monospace" font-size="12.000" x="755.000" y="185.000">Keep</text>
    <text fill="#ffffff" font-family="monospace" font-size="10.000" x="760.000" y="200.000">[U]</text>

    <!-- Output Drop -->
    <rect fill="#cc0000" height="60.000" stroke="#cc0000" stroke-width="2.000" width="120.000" x="720.000" y="250.000"/>
    <text fill="#ffffff" font-family="monospace" font-size="12.000" x="755.000" y="285.000">Drop</text>
    <text fill="#ffffff" font-family="monospace" font-size="10.000" x="750.000" y="300.000">discarded</text>

    <!-- Edges -->
    <line stroke="#666666" stroke-width="2.000" x1="220.000" x2="300.000" y1="230.000" y2="180.000"/>
    <line stroke="#666666" stroke-width="2.000" x1="220.000" x2="300.000" y1="230.000" y2="280.000"/>
    <line stroke="#666666" stroke-width="2.000" x1="420.000" x2="500.000" y1="180.000" y2="210.000"/>
    <line stroke="#666666" stroke-width="2.000" x1="420.000" x2="500.000" y1="280.000" y2="250.000"/>
    <line stroke="#00cc00" stroke-width="2.000" x1="640.000" x2="720.000" y1="210.000" y2="180.000"/>
    <line stroke="#cc0000" stroke-width="2.000" x1="640.000" x2="720.000" y1="250.000" y2="280.000"/>

    <!-- Laws -->
    <text font-family="monospace" font-size="11.000" x="100.000" y="400.000">Laws:</text>
    <text font-family="monospace" font-size="10.000" x="100.000" y="420.000">✓ E1: FOCUS(xs,true,f,g) ≡ map(xs,f)</text>
    <text font-family="monospace" font-size="10.000" x="100.000" y="440.000">✓ E2: FOCUS(xs,p,id,g) ≡ filter(xs,p)</text>
    <text font-family="monospace" font-size="10.000" x="100.000" y="460.000">✓ E3: FOCUS(FOCUS(xs,p1,f1,g1),p2,f2,g2) ≡ FOCUS(xs,p1∧p2,f2∘f1,g')</text>
    <text font-family="monospace" font-size="10.000" x="100.000" y="480.000">✓ E4: FOCUS(xs,p,f,g) = FOCUS(xs,p,f,g)</text>
    <text font-family="monospace" font-size="10.000" x="100.000" y="500.000">✓ E5: partition via FOCUS</text>

    <!-- Performance Metrics -->
    <text font-family="monospace" font-size="11.000" x="100.000" y="560.000">Performance:</text>
    <text font-family="monospace" font-size="10.000" x="100.000" y="580.000">• Single pass: O(n)</text>
    <text font-family="monospace" font-size="10.000" x="100.000" y="600.000">• Memory: O(1) additional</text>
    <text font-family="monospace" font-size="10.000" x="100.000" y="620.000">• vs filter+map: 1.8x faster</text>

    <!-- CID -->
    <text font-family="monospace" font-size="9.000" x="100.000" y="720.000">CID: bafybeig7kqxpq3fyj2ysqxcfhqz3xwqtxzw5x3x</text>
