<!DOCTYPE html>
<html>
<head>
  <title>LVG Demo Viewer</title>
  <style>
    body {
      margin: 0;
      background: #0a0a0a;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: monospace;
    }
    .container {
      text-align: center;
    }
    h1 {
      color: #61dafb;
      margin-bottom: 20px;
    }
    .svg-container {
      border: 2px solid #333;
      border-radius: 8px;
      overflow: hidden;
      display: inline-block;
    }
    .info {
      color: #666;
      margin-top: 20px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🔮 Lambda View Graph</h1>
    <div class="svg-container">
      <?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800">
  <!-- Background -->
  <rect width="1200" height="800" fill="#1e1e1e"/>

  <!-- Title -->
  <text x="600" y="30" text-anchor="middle" fill="#fff" font-size="20" font-family="monospace">
    Lambda View Graph - Demo
  </text>

  <!-- Edges -->
  <line x1="200" y1="150" x2="600" y2="150" stroke="#61dafb" stroke-width="2" opacity="0.6"/>
  <line x1="600" y1="150" x2="200" y2="350" stroke="#61dafb" stroke-width="2" opacity="0.6"/>
  <line x1="200" y1="350" x2="600" y2="350" stroke="#9333ea" stroke-width="2" opacity="0.6"/>
  <line x1="200" y1="150" x2="600" y2="350" stroke="#666" stroke-width="2" opacity="0.6"/>

  <!-- Nodes -->
  <g transform="translate(200, 150)">
    <circle r="40" fill="#3178c6" stroke="#fff" stroke-width="2"/>
    <text y="5" text-anchor="middle" fill="#fff" font-size="12" font-family="monospace">
      index.ts
    </text>
  </g>
  <g transform="translate(600, 150)">
    <circle r="30" fill="#61dafb" stroke="#fff" stroke-width="2"/>
    <text y="5" text-anchor="middle" fill="#fff" font-size="12" font-family="monospace">
      transform
    </text>
  </g>
  <g transform="translate(200, 350)">
    <circle r="30" fill="#61dafb" stroke="#fff" stroke-width="2"/>
    <text y="5" text-anchor="middle" fill="#fff" font-size="12" font-family="monospace">
      compose
    </text>
  </g>
  <g transform="translate(600, 350)">
    <circle r="30" fill="#692b7c" stroke="#fff" stroke-width="2"/>
    <text y="5" text-anchor="middle" fill="#fff" font-size="12" font-family="monospace">
      LVG
    </text>
  </g>

  <!-- Legend -->
  <g transform="translate(50, 700)">
    <circle cx="0" cy="0" r="10" fill="#3178c6"/>
    <text x="20" y="5" fill="#fff" font-size="12" font-family="monospace">Module</text>

    <circle cx="100" cy="0" r="10" fill="#61dafb"/>
    <text x="120" y="5" fill="#fff" font-size="12" font-family="monospace">Function</text>

    <circle cx="220" cy="0" r="10" fill="#692b7c"/>
    <text x="240" y="5" fill="#fff" font-size="12" font-family="monospace">Type</text>
  </g>

  <!-- Stats -->
  <g transform="translate(50, 750)">
    <text fill="#666" font-size="10" font-family="monospace">
      Nodes: 4 | Edges: 4 | Generated: 2025-09-15T09:17:50.892Z
    </text>
  </g>
</svg>
    </div>
    <div class="info">
      Pure Lambda - Universal λ Layer | <a href="demo-lvg.json" style="color: #61dafb">View JSON</a>
    </div>
  </div>
</body>
</html>
