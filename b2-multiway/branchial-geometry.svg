<svg width="600" height="400" xmlns="http://www.w3.org/2000/svg">
    <rect width="600" height="400" fill="#0a0e27"/>

    <!-- Grid -->
    <line x1="50" y1="50" x2="550" y2="50"
                    stroke="#30363d" stroke-dasharray="5,5" opacity="0.5"/><line x1="50" y1="125" x2="550" y2="125"
                    stroke="#30363d" stroke-dasharray="5,5" opacity="0.5"/><line x1="50" y1="200" x2="550" y2="200"
                    stroke="#30363d" stroke-dasharray="5,5" opacity="0.5"/><line x1="50" y1="275" x2="550" y2="275"
                    stroke="#30363d" stroke-dasharray="5,5" opacity="0.5"/><line x1="50" y1="350" x2="550" y2="350"
                    stroke="#30363d" stroke-dasharray="5,5" opacity="0.5"/>

    <!-- Axes -->
    <line x1="50" y1="350" x2="550" y2="350"
          stroke="#8b949e" stroke-width="2"/>
    <line x1="50" y1="50" x2="50" y2="350"
          stroke="#8b949e" stroke-width="2"/>

    <!-- Width curve -->
    <polyline points="M 50,50 L 550,80" fill="none" stroke="#58a6ff" stroke-width="3"/>

    <!-- Curvature curve -->
    <polyline points="M 50,190 L 550,200" fill="none" stroke="#f85149" stroke-width="2" opacity="0.7"/>

    <!-- Points -->
    
      <circle cx="50" cy="50" r="4"
              fill="#58a6ff"/>
    
      <circle cx="550" cy="80" r="4"
              fill="#58a6ff"/>
    

    <!-- Labels -->
    <text x="300" y="390" fill="#e1e4e8" text-anchor="middle">Time</text>
    <text x="20" y="200" fill="#e1e4e8" text-anchor="middle"
          transform="rotate(-90 20 200)">Width</text>

    <!-- Legend -->
    <rect x="450" y="10" width="140" height="60" fill="#161b22" stroke="#30363d"/>
    <line x1="460" y1="25" x2="480" y2="25" stroke="#58a6ff" stroke-width="3"/>
    <text x="485" y="30" fill="#e1e4e8" font-size="12">Width W(t)</text>
    <line x1="460" y1="45" x2="480" y2="45" stroke="#f85149" stroke-width="2"/>
    <text x="485" y="50" fill="#e1e4e8" font-size="12">Curvature κ(t)</text>
  </svg>