name: Daily Snapshot CAR

on:
  schedule:
    - cron: "20 21 * * *"   # 5 хв після signed-digest (21:15)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-snapshot
  cancel-in-progress: true

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - run: npm ci || true

      # Ensure we have fresh data for snapshot
      - name: Generate trust metrics
        run: node scripts/fed/trust.mjs --json > dist/trust.json || true

      - name: Create CAR snapshot
        run: node scripts/snapshots/make-car.mjs

      - name: Attest CAR snapshot
        env:
          PL_ED25519_SECRET: ${{ secrets.PL_ED25519_SECRET }}
        run: node scripts/snapshots/attest-car.mjs

      - name: Update snapshot index
        run: node scripts/snapshots/update-index.mjs

      - name: Commit CAR snapshot
        run: |
          git config user.name "pl-bot"
          git config user.email "actions@users.noreply.github.com"
          git add dist/snapshots/*.car dist/snapshots/*/MANIFEST.json dist/snapshots/index.json receipts/attest/snapshots/*.envelope.json || true
          git diff --cached --quiet || git commit -m "chore(snapshot): daily CAR + attestation + index $(date -u +%F) [${GITHUB_RUN_ID}]"
          git push