name: PR Labeler

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  label:
    name: Auto-label PR
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Auto-label PR
        uses: actions/labeler@v5
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          configuration-path: .github/labeler.yml

      - name: Add trust score label
        if: contains(github.event.pull_request.title, '[seed]')
        uses: actions/github-script@v7
        with:
          script: |
            // This will be populated by the ck-validate workflow
            // For now, just add a placeholder label
            const labels = ['awaiting-validation'];

            await github.rest.issues.addLabels({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: labels
            });

      - name: Add first-time contributor label
        uses: actions/github-script@v7
        with:
          script: |
            const contributor = context.payload.pull_request.user.login;

            // Check if this is the user's first contribution
            const { data: prs } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              creator: contributor,
              state: 'all'
            });

            if (prs.length === 1) {
              await github.rest.issues.addLabels({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                labels: ['first-time-contributor']
              });
            }

      - name: Add size label
        uses: actions/github-script@v7
        with:
          script: |
            const { data: files } = await github.rest.pulls.listFiles({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number
            });

            const changedLines = files.reduce((acc, file) => acc + file.additions + file.deletions, 0);

            let sizeLabel;
            if (changedLines < 10) sizeLabel = 'size:xs';
            else if (changedLines < 100) sizeLabel = 'size:s';
            else if (changedLines < 500) sizeLabel = 'size:m';
            else if (changedLines < 1000) sizeLabel = 'size:l';
            else sizeLabel = 'size:xl';

            await github.rest.issues.addLabels({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: [sizeLabel]
            });