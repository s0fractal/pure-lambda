name: LLM Sentinel - AWS Lambda Reference Check

on:
  pull_request:
    paths:
      - '**/*.md'
      - '**/*.txt'
      - '**/*.py'
      - '**/*.js'
      - '**/*.ts'
      - 'docs/**'

jobs:
  check-aws-references:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v3

    - name: Check for inappropriate AWS Lambda references
      run: |
        #!/bin/bash
        set -e

        echo "🔍 Scanning for inappropriate AWS Lambda references..."

        # Define patterns to check
        AWS_PATTERNS=(
          "aws lambda"
          "AWS Lambda"
          "serverless framework"
          "cloudwatch"
          "CloudWatch"
          "api gateway"
          "API Gateway"
          "lambda@edge"
          "Lambda@Edge"
          "sam deploy"
          "SAM deploy"
        )

        # Files to exclude from check (FaaS adapters are allowed)
        EXCLUDE_PATHS="adapters/faas"

        # Check each pattern
        FOUND_ISSUES=0

        for pattern in "${AWS_PATTERNS[@]}"; do
          echo "Checking for: $pattern"

          # Use grep to find matches, excluding adapter directory
          if git diff --name-only origin/main...HEAD | \
             grep -v "$EXCLUDE_PATHS" | \
             xargs -I {} sh -c "grep -il '$pattern' {} 2>/dev/null || true" | \
             grep -v "^$"; then

            echo "❌ Found inappropriate reference to '$pattern'"
            echo "   These should reference λ-calculus, not AWS services!"
            FOUND_ISSUES=$((FOUND_ISSUES + 1))
          fi
        done

        if [ $FOUND_ISSUES -gt 0 ]; then
          echo ""
          echo "⚠️  Found $FOUND_ISSUES inappropriate AWS references!"
          echo ""
          echo "📚 Remember:"
          echo "  - 'lambda' = λ-calculus (mathematical)"
          echo "  - 'gene' = verified λ-term"
          echo "  - 'pulse' = computational heartbeat"
          echo ""
          echo "✅ Allowed only in /adapters/faas/ directory"
          exit 1
        else
          echo "✅ No inappropriate AWS references found!"
        fi

    - name: Validate proper lambda terminology
      run: |
        #!/bin/bash

        echo "📖 Checking for proper λ-calculus terminology..."

        # Check that lambda references use proper notation
        GOOD_PATTERNS=(
          "λ-calculus"
          "lambda calculus"
          "λ-term"
          "beta reduction"
          "λx."
          "λKernel"
          "Pure Lambda"
        )

        # Count good references
        GOOD_REFS=0
        for pattern in "${GOOD_PATTERNS[@]}"; do
          count=$(git diff --name-only origin/main...HEAD | \
                  xargs -I {} sh -c "grep -c '$pattern' {} 2>/dev/null || echo 0" | \
                  awk '{sum += $1} END {print sum}')
          GOOD_REFS=$((GOOD_REFS + count))
        done

        echo "Found $GOOD_REFS proper λ-calculus references ✅"

        if [ $GOOD_REFS -eq 0 ]; then
          echo "⚠️  Warning: No λ-calculus terminology found"
          echo "   Consider adding proper mathematical notation"
        fi